model:
  type: diffusion_policy
  vision_language_backbone:
    type: clip_backbone
    hf_pretrained: openai/clip-vit-base-patch32
    freeze_text_encoder: true
    freeze_image_encoder: false
  transformer:
    type: transformer
    hidden_dim: 1024
    n_heads: 16
    n_layers: 24
    ffn_type: swiglu
    positional_embedding_type: rotary
    is_causal: false
    max_seq_len: 2048
    norm_type: default_layer_norm
    attn_name: torch_attn
  noise_scheduler:
    num_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    clamp_range: [-1.5, 1.5]
  use_flow_matching_scheduler: true
data:
  type: robotics
  image_size: 224
  processor: openai/clip-vit-base-patch32
  processor_kwargs:
    size:
      height: 224
      width: 224
  img_num_tokens: 64
  allow_multiple_epochs: true
  seq_len: 2048
  lowdim_past_timesteps: 1
  lowdim_future_timesteps: 14
  num_workers: 8
  prefetch_factor: 8
  action_dim: 7
  proprioception_dim: 0
  dataset_manifest:
    - /home/aliangdw/vla_foundry_datasets/libero/shards/manifest.jsonl
  dataset_statistics:
    - /home/aliangdw/vla_foundry_datasets/libero/shards/stats.json
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - image
    - wrist_image
  image_indices:
    - -1
    - 0
  action_fields:
    - actions
  proprioception_fields: []
  normalization:
    enabled: true
    method: std
    scope: global
    centered_norm: true
    include_fields:
      - actions
    field_configs:
      actions:
        enabled: true
        method: std
        scope: global
  augmentation:
    image:
      crop:
        enabled: true
        shape: [224, 224]
        mode: center
  language_instruction_types:
    - original
distributed:
  fsdp: true
hparams:
  precision: amp_bf16
  loss_function: mse
  grad_clip_norm: 1.0
  lr: 5e-4
  lr_cooldown_end: 1e-5
  per_gpu_batch_size: 16
  global_batch_size: 128
  optimizer: adamw
  lr_scheduler: cosine
  warmup: '0.1'
  wd: 1e-6
  seed: 42
num_checkpoints: 10
total_train_samples: 2000000
save_path: /home/aliangdw/rfm_rl/outputs/vla_foundry/libero_flow_dual_cam
name: libero_flow_dual_cam
wandb: true
wandb_project_name: vla_foundry
