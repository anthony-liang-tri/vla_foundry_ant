model:
  type: diffusion_policy
  vision_language_backbone:
    type: clip_backbone
    hf_pretrained: openai/clip-vit-base-patch32
    freeze_text_encoder: true
    freeze_image_encoder: false
  transformer:
    type: transformer
    hidden_dim: 1024
    n_heads: 16
    n_layers: 24
    ffn_type: swiglu
    positional_embedding_type: rotary
    is_causal: false
    max_seq_len: 2048
    norm_type: default_layer_norm
    attn_name: torch_attn
  noise_scheduler:
    num_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    clamp_range: [-1.5, 1.5]
  use_flow_matching_scheduler: true
data:
  type: robotics
  image_size: 224
  processor: openai/clip-vit-base-patch32
  processor_kwargs:
    size:
      height: 224
      width: 224
  img_num_tokens: 64
  allow_multiple_epochs: true
  seq_len: 2048
  lowdim_past_timesteps: 1
  lowdim_future_timesteps: 14
  num_workers: 8
  prefetch_factor: 8
  action_dim: 7
  proprioception_dim: 0
  dataset_manifest:
    - /home/aliangdw/vla_foundry_datasets/robosuite_pretrain/shards/manifest.jsonl
  dataset_statistics:
    - /home/aliangdw/vla_foundry_datasets/robosuite_pretrain/shards/stats.json
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - agentview
    - wrist
  image_indices:
    - -1
    - 0
  action_fields:
    - actions
  proprioception_fields: []
  normalization:
    enabled: true
    method: std
    scope: global
    centered_norm: true
    include_fields:
      - actions
    field_configs:
      actions:
        enabled: true
        method: std
        scope: global
  augmentation:
    image:
      crop:
        enabled: true
        shape: [224, 224]
        mode: center
  language_instruction_types:
    - original
distributed:
  fsdp: true
hparams:
  precision: amp_bf16
  loss_function: mse
  grad_clip_norm: 1.0
  lr: 5e-4
  lr_cooldown_end: 1e-5
  per_gpu_batch_size: 16
  global_batch_size: 128
  optimizer: adamw
  lr_scheduler: cosine
  warmup: '0.1'
  wd: 1e-6
  seed: 42
num_checkpoints: 10
total_train_samples: 10000000
save_path: /home/aliangdw/rfm_rl/outputs/vla_foundry/robosuite_flow_dual_cam
name: robosuite_flow_dual_cam
wandb: true
wandb_project_name: vla_foundry_robosuite
intermediate_eval:
  enabled: true
  every_n_checkpoints: 1
  fail_training_on_error: false
  timeout_seconds: 1800
  python: /home/aliangdw/rfm_rl/.venv/bin/python
  script_path: /home/aliangdw/rfm_rl/scripts/eval_multitask_dit.py
  rfm_rl_dir: /home/aliangdw/rfm_rl
  vla_foundry_dir: /home/aliangdw/vla_foundry_internal
  data_dir: /home/aliangdw/rfm_rl/data/robosuite
  eval_dir: /home/aliangdw/rfm_rl/outputs/vla_foundry_eval/robosuite_intermediate
  cuda_visible_devices: "0"
  mujoco_gl: egl
  mode: rollout
  tasks:
    - lift
    - can
    - square
  episodes: 10
  seed: 1000
  num_inference_steps: 50
  vla_action_exec_len: 4
  image_convention: opencv
  expected_image_convention: opencv
  flip_rollout_images: false
  validate_obs_format: true
  save_videos: true
  video_episodes: 2
  video_fps: 20
  video_codec: libx264
