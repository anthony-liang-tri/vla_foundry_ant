[project]
name = "lbm2"
version = "0.1.0"
description = "A codebase for training Large Behavior Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.0",
    "transformers==4.52.3",
    "webdataset==0.2.111",
    "torchvision==0.22.0",
    "timm==1.0.15",
    "wandb>=0.21.1",
    "s3fs>=2025.7.0",
    "boto3>=1.39.5",
    "botocore>=1.39.17",
    "nest-asyncio",
    "accelerate==1.7.0",
    "sentencepiece==0.2.0",
    "matplotlib>=3.10.5",
    "tqdm>=4.67.1",
    "scipy>=1.15.3",
    "ruff>=0.12.0",
    "pytest>=8.4.1",
    "huggingface-hub>=0.33.0",
    "diffusers>=0.34.0",
    "einops>=0.8.1",
    "draccus>=0.11.5",
    "ray>=2.48.0",
]

[dependency-groups]
# Add `--group sagemaker` to sync the env with sagemaker
# or run a script with sagemaker installed.
sagemaker = [
    "sagemaker>=2.251.0",
]

# Add `--group preprocessing` to install preprocessing deps.
preprocessing = [
    "opencv-python>=4.11.0.86",
    "datasets>=2.14.4",
    "pyarrow==20.0.0",
    "av>=15.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.1",
    "pyturbojpeg>=1.8.2",
    "imageio[ffmpeg]>=2.37.0",
]

# Add `--group visualization` to install visualization deps.
visualization = [
    "gradio>=5.43.1",
    "plotly>=6.3.0",
]

# Add `--group inference` to install runtime deps for GRPC policy serving and robot gym
inference = [
    "robot-gym",
    "grpc-workspace",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lbm2*"]
exclude = ["install*", "sagemaker*", "examples*"]

[tool.uv.sources]
# This specifies custom sources for dependencies
draccus = { git = "https://github.com/jmercat/draccus.git", rev = "jean/fix_include" }
robot-gym = { workspace = true }
grpc_workspace = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    "packages/",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
