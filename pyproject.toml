[project]
name = "lbm2"
version = "0.1.0"
description = "A codebase for training Large Behavior Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.0",
    "transformers==4.52.3",
    "webdataset==0.2.111",
    "torchvision==0.22.0",
    "timm==1.0.15",
    "wandb",
    "s3fs",
    "boto3==1.38.23",
    "nest-asyncio",
    "accelerate==1.7.0",
    "sentencepiece==0.2.0",
    "matplotlib",
    "ruff>=0.12.0",
    "pytest>=8.4.1",
]

[dependency-groups]
# Add `--group sagemaker` to sync the env with sagemaker
# or run a script with sagemaker installed.
sagemaker = [
    "sagemaker==2.240.1.dev0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lbm2*"]
exclude = ["install*", "sagemaker*", "examples*"]

[tool.uv.sources]
# This specifies the path to use in installing sagemaker in the above deps.
sagemaker = { path = "./install/sagemaker-2.240.1.dev0.tar" }

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
