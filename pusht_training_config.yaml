model:
  <<: !include vla_foundry/config_presets/models/diffusion_policy.yaml
  vision_language_backbone:
    type: vit_backbone
    img_size: 96
    hidden_dim: 64
    inter_dim: 256
    n_heads: 4
    n_layers: 4
    patch_size: 8
  transformer:
    type: transformer
    hidden_dim: 64
    n_heads: 4
    n_layers: 4
    is_causal: True

data:
  <<: !include vla_foundry/config_presets/data/diffusion_policy.yaml
  processor: "none"
  image_size: 96
  dataset_manifest:
    - ./tutorials/data/preprocessed/pusht/shards/manifest.jsonl
  dataset_statistics:
    - ./tutorials/data/preprocessed/pusht/shards/stats.json
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - observation.image
  image_indices:
    - -1
    - 0
  action_fields:
    - action
  proprioception_fields:
    - observation.state
  num_workers: 4

distributed:
  fsdp: True

hparams:
  <<: !include vla_foundry/config_presets/hparams/diffusion_policy.yaml
  per_gpu_batch_size: 64
  global_batch_size: 64
  optimizer: adamw
  lr_scheduler: cosine
  warmup: '0.1'
  wd: 1e-6
  seed: 42

total_train_samples: 2000000
num_checkpoints: 20
save_path: /home/anthonyliang/Documents/vla_foundry_ant/outputs/pusht_diffusion_v2
name: pusht_diffusion_v2
wandb: true
wandb_entity: tri
wandb_project_name: vla_foundry_robosuite
intermediate_eval:
  enabled: true
  every_n_checkpoints: 2
  fail_training_on_error: false
  env: pusht
  eval_dir: /home/anthonyliang/Documents/vla_foundry_ant/outputs/pusht_eval_v2
  tasks:
    - PushT
  episodes: 10
  seed: 42
  max_steps: 300
  num_inference_steps: 10
  action_window: 8
  save_videos: true
  video_episodes: 2
  video_fps: 20
