data:
  allow_multiple_epochs: false
  dataset_manifest:
  - s3://tri-ml-datasets/datasets/datacompdr_1b/manifest.jsonl
  dataset_modality:
  - image_caption
  dataset_weighting:
  - 1.0
  image_size: 224
  img_num_tokens: 64
  num_workers: 8
  prefetch_factor: 4
  processor: HuggingFaceTB/SmolVLM2-256M-Video-Instruct
  processor_kwargs:
    max_image_size:
      longest_edge: 224
    size:
      longest_edge: 224
