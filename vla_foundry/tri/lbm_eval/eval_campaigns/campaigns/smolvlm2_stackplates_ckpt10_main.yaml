# Evaluation Campaign Configuration
# Auto-generated eval for 2026_04_09-11_04_37-model_diffusion_policy-lr_0.0001-bsz_256

campaign_name: "smolvlm2_stackplates_ckpt10_main"
description: "Auto-generated eval for single-task SmolVLM2 model on BimanualStackPlatesOnTableFromDryingRack, checkpoint 10"

# Cluster configuration
cluster:
  config_file: "vla_foundry/tri/lbm_eval/eval_campaigns/ray_policy_runner_cluster.yaml"
  num_workers: 256
  aws_profile: "manip-cluster"
  owner_email: "jean.mercat@tri.global"
  teardown_on_completion: true
  teardown_on_failure: false

# Evaluation configuration
evaluation:
  jobs_per_gpu: 1
  tasks_file: "vla_foundry/tri/lbm_eval/eval_campaigns/task_lists/smolvlm2_stackplates_ckpt10.txt"
  num_samples: 200
  start_index: 0
  launch_scenario: "GrpcServerToSim"
  launch_script: "launch_sim.sh"
  num_flow_steps: 8
  open_loop_steps: 8
  device: "cuda"
  entrypoint_num_gpus: 1
  entrypoint_memory: 62277025792
  max_retries: 3
  inference_aws_profile: "sagemaker"

# Docker configuration
docker:
  image: "682769330988.dkr.ecr.us-east-1.amazonaws.com/anzu-vla-foundry:latest"

# vla_foundry source management
vla_foundry:
  repo_url: "git@github.com:jmercat/vla_foundry.git"
  ref: "main"
  local_dir: "~/.cache/vla_foundry/ray_mount"
  use_remote_repo: true
  remote_dir: "/home/ubuntu/vla_foundry_mount"
  mount_target: "/opt/vla_foundry"

# Output configuration
output:
  results_dir: "results/smolvlm2_stackplates_ckpt10_main"
  save_job_logs: true
