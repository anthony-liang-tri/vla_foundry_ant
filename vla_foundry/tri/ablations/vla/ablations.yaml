# VLA ablation experiment definitions
# Each ablation can override base_args from nominal_config.yaml
#
# Sweep syntax:
#   - List: [value1, value2, value3]
#   - Linear range: linspace(start, end, n_steps)
#   - Log range: logspace(start, end, n_steps)
#
# Sweeps generate multiple ablations with auto-naming:
#   ablation_name + "_" + param_short_name + "_" + value

ablations:
  # Basic ablations (uses default total_train_samples: 10_000_000 from nominal_config.yaml)
  nominal_10m: {}

  nominal_30m:
    total_train_samples: 30_000_000

  relative:
    data.action_fields: '["robot__action__poses__left::panda__xyz_relative", "robot__action__poses__right::panda__xyz_relative", "robot__action__poses__left::panda__rot_6d_relative", "robot__action__poses__right::panda__rot_6d_relative", "robot__action__grippers__left::panda_hand", "robot__action__grippers__right::panda_hand"]'

  relative_per_timestep:
    data.normalization.scope: per_timestep
    data.action_fields: '["robot__action__poses__left::panda__xyz_relative", "robot__action__poses__right::panda__xyz_relative", "robot__action__poses__left::panda__rot_6d_relative", "robot__action__poses__right::panda__rot_6d_relative", "robot__action__grippers__left::panda_hand", "robot__action__grippers__right::panda_hand"]'

  relative_with_proprioception:
    data.proprioception_fields: '["robot__actual__poses__left::panda__xyz", "robot__actual__poses__right::panda__xyz", "robot__actual__poses__left::panda__rot_6d", "robot__actual__poses__right::panda__rot_6d"]'
    data.action_fields: '["robot__action__poses__left::panda__xyz_relative", "robot__action__poses__right::panda__xyz_relative", "robot__action__poses__left::panda__rot_6d_relative", "robot__action__poses__right::panda__rot_6d_relative", "robot__action__grippers__left::panda_hand", "robot__action__grippers__right::panda_hand"]'

  relative_per_timestep_with_proprioception:
    data.normalization.scope: per_timestep
    data.proprioception_fields: '["robot__actual__poses__left::panda__xyz", "robot__actual__poses__right::panda__xyz", "robot__actual__poses__left::panda__rot_6d", "robot__actual__poses__right::panda__rot_6d"]'
    data.action_fields: '["robot__action__poses__left::panda__xyz_relative", "robot__action__poses__right::panda__xyz_relative", "robot__action__poses__left::panda__rot_6d_relative", "robot__action__poses__right::panda__rot_6d_relative", "robot__action__grippers__left::panda_hand", "robot__action__grippers__right::panda_hand"]'

  norm_range_1_5:
    model.noise_scheduler.clamp_range: "[-1.5, 1.5]"

  percentile_95:
    data.normalization.method: percentile_5_95

  std_normalization:
    data.normalization.method: std

  no_rotation_norm:
    data.normalization.field_configs: '{"robot__action__poses__left::panda__rot_6d": {"enabled": false, "method": "percentile_1_99", "scope": "global", "epsilon": 1e-6}, "robot__action__poses__right::panda__rot_6d": {"enabled": false, "method": "percentile_1_99", "scope": "global", "epsilon": 1e-6}}'

  with_proprioception:
    data.proprioception_fields: '["robot__actual__poses__left::panda__xyz", "robot__actual__poses__right::panda__xyz", "robot__actual__poses__left::panda__rot_6d", "robot__actual__poses__right::panda__rot_6d"]'

  image_0:
    data.image_indices: "[0]"

  past_timesteps_0:
    data.image_indices: "[0]"
    data.lowdim_past_timesteps: 0

  past_timesteps_0_image_1:
    data.lowdim_past_timesteps: 0

  per_timestep_norm:
    data.normalization.scope: per_timestep

  lr_sweep:
    hparams.lr: [0.0002, 0.0005, 0.001]

  float32:
    hparams.precision: float32

  # VLA-specific ablations
  vlm_layers_2:
    model.vision_language_backbone.num_vlm_layers_to_use: 2

  vlm_layers_4:
    model.vision_language_backbone.num_vlm_layers_to_use: 4

  freeze_vlm:
    model.vision_language_backbone.freeze: true

  causal_attention:
    model.transformer.is_causal: true

  transformer_410m:
    model.transformer.hidden_dim: 1024
    model.transformer.n_layers: 24
    model.transformer.n_heads: 16

  img_num_tokens_sweep:
    data.img_num_tokens: [64, 128, 256]
