ablations:
  # Basic ablations (uses default total_train_samples: 10_000_000 from nominal_config.yaml)
  nominal: {}

  paligemma_pt_nominal: 
    model.vision_language_backbone.hf_pretrained: "google/paligemma2-3b-pt-224"
    data.processor: "google/paligemma2-3b-pt-224"
    hparams.per_gpu_batch_size: 4
    hparams.global_batch_size: 128
    hparams.torchcompile: true

  paligemma_mix_nominal: 
    model.vision_language_backbone.hf_pretrained: "google/paligemma2-3b-mix-224"
    data.processor: "google/paligemma2-3b-mix-224"
    hparams.per_gpu_batch_size: 4
    hparams.global_batch_size: 128
    hparams.torchcompile: true