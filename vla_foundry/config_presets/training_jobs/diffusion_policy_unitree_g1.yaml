model:
  <<: !include ../models/diffusion_policy.yaml
  input_noise_std: 0.05
  vision_language_backbone:
    hf_pretrained: openai/clip-vit-base-patch32
    freeze_text_encoder: true
    freeze_image_encoder: false
  transformer:
    <<: !include ../models/transformer_410m.yaml
    is_causal: True
  noise_scheduler:
    clamp_range:
      - -1.5
      - 1.5

data:
  <<: !include ../data/unitree_g1/g1_data_params.yaml
  <<: !include ../data/diffusion_policy.yaml
  augmentation:
    image:
      color_jitter:
        enabled: true
      crop:
        enabled: true
  dataset_manifest:
    - s3://robotics-cam-data/platform/unitree_g1_dex3/tarfile/v0/move_block_on_plate/sim/teleop/shards/manifest.jsonl
  dataset_statistics:
    - s3://robotics-cam-data/platform/unitree_g1_dex3/tarfile/v0/move_block_on_plate/sim/teleop/shards/stats.json
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  lowdim_past_timesteps: 1
  lowdim_future_timesteps: 47
  prefetch_factor: 16
  img_num_tokens: 256

distributed:
  fsdp: false

hparams:
  <<: !include ../hparams/diffusion_policy.yaml
  precision: "float32"
  lr: 1e-4
  lr_cooldown_end: 5e-5
  wd: 1e-4
  per_gpu_batch_size: 24
  global_batch_size: 48

ema:
  enabled: true

