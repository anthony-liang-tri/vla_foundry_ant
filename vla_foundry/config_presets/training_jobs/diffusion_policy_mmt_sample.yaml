model:
  <<: !include ../models/diffusion_policy.yaml
  vision_language_backbone:
    type: clip_backbone
    hf_pretrained: openai/clip-vit-base-patch32
    disable_text: false
  transformer:
    <<: !include ../models/transformer_100m.yaml
    is_causal: false
data:
  <<: !include ../data/diffusion_policy.yaml
  dataset_manifest:
    - /path/to/dataset/shards/manifest.jsonl
  dataset_statistics:
    - /path/to/dataset/shards/stats.json
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - rgb
  image_indices:
    - -1
    - 0
  action_fields:
    - arm_action
  proprioception_fields:
    - chassis_T_eef_pose
distributed:
  fsdp: True
hparams:
  <<: !include ../hparams/diffusion_policy.yaml
  per_gpu_batch_size: 4
  global_batch_size: 8
