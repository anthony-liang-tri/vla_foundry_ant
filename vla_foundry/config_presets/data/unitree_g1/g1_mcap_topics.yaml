# Unitree G1 MCAP Topics Configuration
# Config-driven sub-field extraction of state / action topics
#
# Usage: Preprocess once, select fields at training time
#
# Field path syntax:
#   "field"              - Simple attribute
#   "field.nested"       - Nested attribute
#   "field[*]"           - Iterate list, flatten
#   "field[*].attr"      - Extract attr from each list item
#   "field[*].attr[*]"   - Nested iteration (flattened)
#
# Some fields (IMU, whole-body motor torques) are commented out pending
# pipeline stabilization and can be re-enabled as needed.
target_hz: 30.0
output_mode: separate

# =============================================================================
# ACTION TOPICS
# =============================================================================

action_topics:
  - /ee_target_left
  - /ee_target_right
  - /joint_cmd_hand_left
  - /joint_cmd_hand_right
  # - /joint_cmd_whole_body_torque

action_field_map:
  /ee_target_left: action_ee_pose_left
  /ee_target_right: action_ee_pose_right
  /joint_cmd_hand_left: action_joint_hand_left
  /joint_cmd_hand_right: action_joint_hand_right
  # /joint_cmd_whole_body: action_joint_whole_body

reference_field_prefixes:
  action_joint_hand_left__: actual_joint_states__
  action_joint_hand_right__: actual_joint_states__
  action_: actual_
  desired_: actual_

# =============================================================================
# STATE TOPICS
# =============================================================================

state_topics:
  - /joint_states
  - /current_left_hand_ee_link
  - /current_right_hand_ee_link
  # - /imu
  # - /livox/imu_192_168_123_120
  - /dex3/left/state
  - /dex3/right/state
  # - /lowstate (Motor level torque, position, velocity)

state_field_map:
  /joint_states: actual_joint_states
  /current_left_hand_ee_link: actual_ee_pose_left
  /current_right_hand_ee_link: actual_ee_pose_right
  /dex3/left/state: actual_dex3_hand_left
  /dex3/right/state: actual_dex3_hand_right
  # /imu: actual_imu
  # /livox/imu_192_168_123_120: actual_imu_livox

# =============================================================================
# SUB-FIELD EXTRACTION
# =============================================================================
# For complex messages, extract specific fields into separate arrays.
# Each entry creates a virtual subtopic: {topic}.{output_name}

state_topic_subfield_extraction:
  /dex3/left/state:
    joints: "motor_state[*].q"
    joints_vel: "motor_state[*].dq"
    joints_torque: "motor_state[*].tau_est"
    pressure: "press_sensor_state[*].pressure"
    # imu: "imu_state"

  /dex3/right/state:
    joints: "motor_state[*].q"
    joints_vel: "motor_state[*].dq"
    joints_torque: "motor_state[*].tau_est"
    pressure: "press_sensor_state[*].pressure"
    # imu: "imu_state"

  /lowstate:
    motor_q: "motor_state[*].q"
    motor_dq: "motor_state[*].dq"
    motor_tau: "motor_state[*].tau_est"
    # imu: "imu_state"

# Map extracted sub-fields to clean output names
state_topic_subfield_map:
  # Left hand (dex3)
  /dex3/left/state.joints: actual_dex3_hand_left_joints
  /dex3/left/state.joints_vel: actual_dex3_hand_left_joints_vel
  /dex3/left/state.joints_torque: actual_dex3_hand_left_joints_torque
  /dex3/left/state.pressure: actual_dex3_hand_left_pressure
  # /dex3/left/state.imu: actual_dex3_hand_left_imu
  # Right hand (dex3)
  /dex3/right/state.joints: actual_dex3_hand_right_joints
  /dex3/right/state.joints_vel: actual_dex3_hand_right_joints_vel
  /dex3/right/state.joints_torque: actual_dex3_hand_right_joints_torque
  /dex3/right/state.pressure: actual_dex3_hand_right_pressure
  # /dex3/right/state.imu: actual_dex3_hand_right_imu
  # Motor state
  # /lowstate.motor_q: actual_motor_positions
  # /lowstate.motor_dq: actual_motor_velocities
  # /lowstate.motor_tau: actual_motor_torques
  # /lowstate.imu: actual_lowstate_imu

# =============================================================================
# CAMERA TOPICS
# =============================================================================

camera_topics:
  - /head_camera/zed_node/left/image_rect_color/compressed
  - /head_camera/zed_node/right/image_rect_color/compressed
  # - /head_camera/color/image_raw/compressed
  - /left_wrist_camera/color/image_rect_raw/compressed
  - /right_wrist_camera/color/image_rect_raw/compressed

camera_topics_field_map:
  /head_camera/zed_node/left/image_rect_color/compressed: stereo_head_left
  /head_camera/zed_node/right/image_rect_color/compressed: stereo_head_right
  # /head_camera/color/image_raw/compressed: head
  /left_wrist_camera/color/image_rect_raw/compressed: left_wrist
  /right_wrist_camera/color/image_rect_raw/compressed: right_wrist
