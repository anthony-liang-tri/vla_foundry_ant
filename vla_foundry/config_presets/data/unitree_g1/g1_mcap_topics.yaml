# Unitree G1 MCAP Topics Configuration
# Config-driven sub-field extraction of state / action topics
#
# Usage: Preprocess once, select fields at training time
#
# Field path syntax:
#   "field"              - Simple attribute
#   "field.nested"       - Nested attribute
#   "field[*]"           - Iterate list, flatten
#   "field[*].attr"      - Extract attr from each list item
#   "field[*].attr[*]"   - Nested iteration (flattened)
#
# Some fields (IMU, whole-body motor torques) are commented out pending
# pipeline stabilization and can be re-enabled as needed.
output_mode: separate

# All lowdim state values in this list will have normalization stats calculated
# TODO(mark.zolotas): Find a better way to grab the largest common subset of
# lowdim state key fields across all data in the mix (e.g., sim and real)
state_key_fields:
  - actual_ee_pose_left__xyz        # 3
  - actual_ee_pose_left__rot_6d     # 6
  - actual_joint_position__left_hand_thumb_0_joint
  - actual_joint_position__left_hand_thumb_1_joint
  - actual_joint_position__left_hand_thumb_2_joint
  - actual_joint_position__left_hand_middle_0_joint
  - actual_joint_position__left_hand_middle_1_joint
  - actual_joint_position__left_hand_index_0_joint
  - actual_joint_position__left_hand_index_1_joint
  - actual_ee_pose_right__xyz       # 3
  - actual_ee_pose_right__rot_6d    # 6
  - actual_joint_position__right_hand_thumb_0_joint
  - actual_joint_position__right_hand_thumb_1_joint
  - actual_joint_position__right_hand_thumb_2_joint
  - actual_joint_position__right_hand_middle_0_joint
  - actual_joint_position__right_hand_middle_1_joint
  - actual_joint_position__right_hand_index_0_joint
  - actual_joint_position__right_hand_index_1_joint

# Pivot source for temporal alignment (any field name from camera, state, or
# action field maps). Raises an error if field name is not found.
pivot_source_field: stereo_head_left

# Maximum gap (seconds) in the pivot source timeline before logging a warning.
gap_threshold_dt: 0.15

# Maximum snap distance (seconds) for nearest-neighbor alignment.
# Raises an error if any sample exceeds this threshold.
snap_threshold_dt: 0.25

# =============================================================================
# ACTION TOPICS
# =============================================================================

action_topics:
  - /ee_target_left
  - /ee_target_right
  - /joint_cmd_hand_left
  - /joint_cmd_hand_right
  # - /joint_cmd_whole_body_torque

action_field_map:
  /ee_target_left: action_ee_pose_left
  /ee_target_right: action_ee_pose_right
  /joint_cmd_hand_left: action_joint_hand_left
  /joint_cmd_hand_right: action_joint_hand_right
  # /joint_cmd_whole_body: action_joint_whole_body

reference_field_prefixes:
  action_joint_hand_left__: actual_joint_position__
  action_joint_hand_right__: actual_joint_position__
  action_: actual_
  desired_: actual_

# =============================================================================
# STATE TOPICS
# =============================================================================

state_topics:
  - /joint_states
  - /current_left_hand_ee_link
  - /current_right_hand_ee_link
  # - /imu
  # - /livox/imu_192_168_123_120
  # - /dex3/left/state
  # - /dex3/right/state
  # - /lowstate (Motor level torque, position, velocity)

state_field_map:
  /joint_states: actual_joint_position
  /current_left_hand_ee_link: actual_ee_pose_left
  /current_right_hand_ee_link: actual_ee_pose_right
  # /dex3/left/state: actual_dex3_hand_left
  # /dex3/right/state: actual_dex3_hand_right
  # /imu: actual_imu
  # /livox/imu_192_168_123_120: actual_imu_livox

# =============================================================================
# SUB-FIELD EXTRACTION
# =============================================================================
# For complex messages, extract specific fields into separate arrays.
# Each entry creates a virtual subtopic: {topic}.{output_name}

state_topic_subfield_extraction:
  # /dex3/left/state:
  #   joints: "motor_state[*].q"
  #   joints_vel: "motor_state[*].dq"
  #   joints_torque: "motor_state[*].tau_est"
  #   pressure: "press_sensor_state[*].pressure"
  #   # imu: "imu_state"

  # /dex3/right/state:
  #   joints: "motor_state[*].q"
  #   joints_vel: "motor_state[*].dq"
  #   joints_torque: "motor_state[*].tau_est"
  #   pressure: "press_sensor_state[*].pressure"
    # imu: "imu_state"

  /lowstate:
    motor_q: "motor_state[*].q"
    motor_dq: "motor_state[*].dq"
    motor_tau: "motor_state[*].tau_est"
    # imu: "imu_state"

