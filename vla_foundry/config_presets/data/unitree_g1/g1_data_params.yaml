type: robotics

proprioception_fields:
  - actual_ee_pose_left__xyz # 3
  - actual_ee_pose_left__rot_6d # 6
  - actual_joint_states__left_hand_thumb_0_joint # 1
  - actual_joint_states__left_hand_thumb_1_joint # 1
  - actual_joint_states__left_hand_thumb_2_joint # 1
  - actual_joint_states__left_hand_middle_0_joint # 1
  - actual_joint_states__left_hand_middle_1_joint # 1
  - actual_joint_states__left_hand_index_0_joint # 1
  - actual_joint_states__left_hand_index_1_joint # 1
  - actual_ee_pose_right__xyz # 3
  - actual_ee_pose_right__rot_6d # 6
  - actual_joint_states__right_hand_thumb_0_joint # 1
  - actual_joint_states__right_hand_thumb_1_joint # 1
  - actual_joint_states__right_hand_thumb_2_joint # 1
  - actual_joint_states__right_hand_middle_0_joint # 1
  - actual_joint_states__right_hand_middle_1_joint # 1
  - actual_joint_states__right_hand_index_0_joint # 1
  - actual_joint_states__right_hand_index_1_joint # 1

action_fields:
  - action_ee_pose_left__xyz_relative # 3
  - action_ee_pose_left__rot_6d_relative # 6
  - action_joint_hand_left__left_hand_thumb_0_joint # 1
  - action_joint_hand_left__left_hand_thumb_1_joint # 1
  - action_joint_hand_left__left_hand_thumb_2_joint # 1
  - action_joint_hand_left__left_hand_middle_0_joint # 1
  - action_joint_hand_left__left_hand_middle_1_joint # 1
  - action_joint_hand_left__left_hand_index_0_joint # 1
  - action_joint_hand_left__left_hand_index_1_joint # 1
  - action_ee_pose_right__xyz_relative # 3
  - action_ee_pose_right__rot_6d_relative # 6
  - action_joint_hand_right__right_hand_thumb_0_joint # 1
  - action_joint_hand_right__right_hand_thumb_1_joint # 1
  - action_joint_hand_right__right_hand_thumb_2_joint # 1
  - action_joint_hand_right__right_hand_middle_0_joint # 1
  - action_joint_hand_right__right_hand_middle_1_joint # 1
  - action_joint_hand_right__right_hand_index_0_joint # 1
  - action_joint_hand_right__right_hand_index_1_joint # 1

pose_groups:
  - name: "left_ee_pose_action"
    position_key: "action_ee_pose_left__xyz"
    rotation_key: "action_ee_pose_left__rot_6d"
  - name: "right_ee_pose_action"
    position_key: "action_ee_pose_right__xyz"
    rotation_key: "action_ee_pose_right__rot_6d"

normalization:
  enabled: true
  method: percentile_1_99
  scope: per_timestep
  epsilon: 1e-2
  centered_norm: true
