# For 3x faster policy architecture (30Hz vs 10Hz baseline).
# Windows scaled to maintain similar temporal duration:
#   - 10Hz baseline: 1 past + 14 future = 1.5s
#   - 30Hz scaled:   3 past + 42 future = 1.5s

# Temporal windowing (Chosen to match atlas cfgs)
past_lowdim_steps: 1
future_lowdim_steps: 47
image_indices:
- -1
- 0
stride: 1
max_padding_left: 0
max_padding_right: 47
padding_strategy: copy

# Filtering
filter_still_samples: False
still_threshold: 0.001

# Image preprocessing
resize_images_size: []
jpeg_quality: 95

# Runtime
max_episodes_to_process: -1
fail_on_nan: True
skip_git_tagging: False