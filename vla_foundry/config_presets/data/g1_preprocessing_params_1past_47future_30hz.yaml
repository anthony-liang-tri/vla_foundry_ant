type: robotics

# Temporal windowing (Chosen to match atlas cfgs)
past_lowdim_steps: 1
future_lowdim_steps: 47
image_indices:
- -1
- 0
stride: 1
max_padding_left: 0
max_padding_right: 47
padding_strategy: zero

# Filtering
filter_still_samples: False
still_threshold: 0.001

# Image preprocessing
image_resizing_method: resize_fit
# 224 x 224 to avoid any center cropping during training, 
# assuming the CLIP-ViT vision backbone is used
# TODO(mark.zolotas): ablate with 256 x 256 resize instead
resize_images_size:
- 224
- 224
# Must align with g1_data_camera_names.yaml
camera_rotations:
  # head: 0
  stereo_head_left: 0
  stereo_head_right: 0
  left_wrist: 3  # Rotate 90° counterclockwise
  right_wrist: 3
jpeg_quality: 95

# Runtime
max_episodes_to_process: -1
fail_on_nan: True
skip_git_tagging: False
