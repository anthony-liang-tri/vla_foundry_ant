# 98-D action space for SONIC whole-body BC (matches what sonic.py consumes):
#   72  SMPL joint positions     (24 joints × xyz, pelvis-local Z-up)          → /smpl_joint_points
#    6  anchor orientation       (root 6-D continuous rotation)                → /reference_motion.root_pose.orientation
#    6  wrist joint refs         (L/R × roll/pitch/yaw)                        → /reference_motion.joint_positions[wrist_indices]
#   14  Dex3 hand joint positions (7 per hand)                                 → /joint_cmd_hand_{left,right}
#
# Note: the 14 `action_joint_hand_left/right__*` entries below MUST stay in
# sync with the same block in `data/unitree_g1/g1_action_fields.yaml`. If you
# rename or add a Dex3 joint, edit both files together (YAML !include can't
# list-concat, so duplication is unavoidable until we lift the joint list to
# a Python const).
#
# SMPL joint order matches the 20260417 MCAP /smpl_joint_points name array:
#   pelvis, left_hip, right_hip, spine1, left_knee, right_knee, spine2,
#   left_ankle, right_ankle, spine3, left_foot, right_foot, neck,
#   left_collar, right_collar, head, left_shoulder, right_shoulder,
#   left_elbow, right_elbow, left_wrist, right_wrist, left_hand, right_hand
action_key_fields:
  # SMPL body (24 joints × xyz = 72)
  - action_smpl__pelvis_x
  - action_smpl__pelvis_y
  - action_smpl__pelvis_z
  - action_smpl__left_hip_x
  - action_smpl__left_hip_y
