source_type: mmt_npz

past_lowdim_steps:   1 
future_lowdim_steps: 14 
image_indices:
- -1
- 0
stride: 1 
max_padding_left: 3 
max_padding_right: 15 
padding_strategy: copy 
filter_still_samples: False 
still_threshold: 0.05 
camera_names: ["rgb", "depth"]
jpeg_quality: 95 
max_episodes_to_process: -1 
fail_on_nan: True 
skip_git_tagging: False 
resize_images_size:
- 384
- 384
mmt_lowdim_flatten_indices_selection:
  chest_T_eef_pose: [{start: 0, end: 14}]  # Include both arms and eefs, optionally disable one arm or one gripper
  chassis_T_eef_pose: [{start: 0, end: 14}]  # Include both arms and eefs, optionally disable one arm or one gripper
  base_pose: [0, 1, 5]  # x, y, yaw
  head_pose: [4, 5]  # pitch, yaw
  lift_pose: [2]  # z
  base_action: [0, 1, 5]  # x, y, yaw
  head_action: [4, 5]  # pitch, yaw
  lift_action: [2]  # z