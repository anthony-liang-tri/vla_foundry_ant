model:
  <<: !include ../../vla_foundry/config_presets/models/diffusion_policy.yaml
  vision_language_backbone:
    type: vit_backbone
    img_size: 96
    hidden_dim: 256
    inter_dim: 1024
    n_heads: 8
    n_layers: 6
    patch_size: 8
  transformer:
    type: transformer
    hidden_dim: 256
    n_heads: 8
    n_layers: 8
    is_causal: false

data:
  <<: !include ../../vla_foundry/config_presets/data/diffusion_policy.yaml
  processor: none
  image_size: 96
  action_dim: 2
  proprioception_dim: 2
  dataset_manifest:
    - tutorials/data/preprocessed/pusht/shards/manifest.jsonl
  dataset_statistics:
    - tutorials/data/preprocessed/pusht/shards/stats.json
  dataset_modality:
    - robotics
  dataset_weighting:
    - 1.0
  camera_names:
    - observation.image
  image_indices:
    - -1
    - 0
  action_fields:
    - action
  proprioception_fields:
    - observation.state
  num_workers: 4
  normalization:
    enabled: true
    method: min_max
    scope: global
    centered_norm: true

distributed:
  fsdp: true

ema:
  enabled: true

hparams:
  <<: !include ../../vla_foundry/config_presets/hparams/diffusion_policy.yaml
  per_gpu_batch_size: 64
  global_batch_size: 64
  optimizer: adamw
  lr_scheduler: cosine
  warmup: "500"
  lr: 1e-4
  wd: 1e-6
  seed: 42

total_train_samples: 72216064
num_checkpoints: 60
max_checkpoint_limit: 6
save_path: outputs/pusht_dit
name: pusht_dit
wandb: true
wandb_entity: tri
wandb_project_name: vla_foundry_pusht
db_logging: false

eval_rollouts:
  enabled: true
  every_n_checkpoints: 1
  fail_training_on_error: false
  env: pusht
  eval_dir: outputs/eval_rollouts/pusht
  tasks:
    - PushT
  episodes: 20
  seed: 1000
  max_steps: 300
  num_inference_steps: 10
  action_window: 8
  save_videos: true
  video_episodes: 4
  video_grid_rows: 2
  video_grid_cols: 2
  video_fps: 10
