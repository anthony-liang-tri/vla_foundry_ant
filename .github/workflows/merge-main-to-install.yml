name: Keep install = main minus cuda-fps in pyproject.toml

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Recreate install from main and remove cuda-fps from pyproject.toml
        run: |
          set -euxo pipefail

          # Ensure local main is current
          git checkout main
          git pull --ff-only origin main

          # Reset install to exactly main
          git checkout -B install main

          # Remove cuda-fps from [project].dependencies (handles optional trailing comma)
          sed -i '/^[[:space:]]*"cuda-fps"[[:space:]]*,\?[[:space:]]*$/d' pyproject.toml

          # Remove cuda-fps entry from [tool.uv.sources] (handles arbitrary spacing)
          sed -i '/^[[:space:]]*cuda-fps[[:space:]]*=[[:space:]]*{.*}$/d' pyproject.toml

          # If nothing changed, do nothing
          if git diff --quiet -- pyproject.toml; then
            echo "No cuda-fps entries found (or already removed); nothing to commit."
            exit 0
          fi

          git add pyproject.toml
          git commit -m "install: remove cuda-fps from pyproject.toml"

          # Update remote install (history is rewritten each time)
          git push --force-with-lease origin install