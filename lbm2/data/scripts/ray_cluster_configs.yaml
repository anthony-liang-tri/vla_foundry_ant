max_workers: 60
upscaling_speed: 0.0
available_node_types:
    ray.head.default:
        resources: {}
        node_config:
            SubnetIds: [subnet-07bf42d7c9cb929e4, subnet-0f72615fd9bd3c717, subnet-0a29e4f1a47443e28, subnet-06e0db77592be2b36]
            SecurityGroupIds: [sg-0441353b5b47d1a1d]
            ImageId: ami-0fc5d935ebf8bc3bc # ray us-east-1
            InstanceType: i4i.4xlarge
            IamInstanceProfile:
                Arn: arn:aws:iam::124224456861:instance-profile/ray-autoscaler-v1
            TagSpecifications:
              - ResourceType: instance
                Tags:
                  - Key: tri.owner.email
                    Value: sedrick.keh@tri.global
                  - Key: tri.project
                    Value: LBM:PJ-0109
    ray.worker.default:
        min_workers: 60
        max_workers: 60
        node_config:
            SubnetIds: [subnet-07bf42d7c9cb929e4, subnet-0f72615fd9bd3c717, subnet-0a29e4f1a47443e28, subnet-06e0db77592be2b36]
            SecurityGroupIds: [sg-0441353b5b47d1a1d]
            ImageId: ami-0fc5d935ebf8bc3bc # ray us-east-1
            InstanceType: i4i.4xlarge
            IamInstanceProfile:
                Arn: arn:aws:iam::124224456861:instance-profile/ray-autoscaler-v1
            TagSpecifications:
              - ResourceType: instance
                Tags:
                  - Key: tri.owner.email
                    Value: sedrick.keh@tri.global
                  - Key: tri.project
                    Value: LBM:PJ-0109

# Cloud-provider specific configuration.
provider:
    type: aws
    region: us-east-1
    cache_stopped_nodes: False
    use_internal_ips: True

file_mounts: {
    "/home/ubuntu/lbm2": "./",
    "/home/ubuntu/.cache/huggingface/token": "~/.cache/huggingface/token",
}

rsync_exclude:
    - "**/.venv/"
    - "**/.venv"
    - "**/wandb"
    - "**/wandb/"
  
setup_commands:
    # - sudo apt-get update -y
    - wget https://repo.anaconda.com/miniconda/Miniconda3-py310_23.3.1-0-Linux-x86_64.sh -O miniconda.sh
    - sudo mkfs -t xfs /dev/nvme1n1
    - sudo mount /dev/nvme1n1 /tmp
    - sudo chown -R $USER /tmp
    # NOTE: This seems to be necessary at TRI AWS due to some permissions issue.
    - sudo chmod 1777 /tmp
    - bash ~/miniconda.sh -f -b -p /tmp/miniconda3/
    - echo 'export PATH="/tmp/miniconda3/bin/:$PATH"' >> ~/.bashrc
    - echo 'export HF_TOKEN=$(cat /home/ubuntu/.cache/huggingface/token)' >> ~/.bashrc
    - mkdir -p ~/.cache/huggingface/
    - pip install --upgrade pip setuptools wheel
    - pip install -U "ray[default] @ https://s3-us-west-2.amazonaws.com/ray-wheels/latest/ray-3.0.0.dev0-cp310-cp310-manylinux2014_x86_64.whl"
    - pip install boto3==1.26.90
    - pip install s3fs==2022.11.0
    - pip install 'pandas==2.1.4'
    - pip install psutil
    - pip install pyarrow
    - pip install --upgrade transformers
    - pip install --upgrade boto3 botocore
    - pip install --upgrade s3fs
    - pip install awscli
    - pip install img2dataset
    - pip install numpy==1.26.0
